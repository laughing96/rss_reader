[pytest]
DJANGO_SETTINGS_MODULE = settings
; env = 
;     RUNNING_TESTS=1
;     DB_NAME=test_db
;     API_KEY=secret_key_for_testing
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests *Test
python_functions = test_*
testpaths = api/tests
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -v
    --capture=no
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning

markers =
    debug: marks tests as debug mode (deselect with '-m "not debug"')
